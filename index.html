<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promosso Patenti – Beta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0f1f1c;--card:#17332e;--txt:#f5fff9;--mut:#a8c7bf;--acc:#0d9488;--acc2:#5eead4;--ok:#2e9e5b;--ko:#d64545;--hd:#fbbf24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:Arial,sans-serif;margin:0}
a{color:var(--acc2)}
header{background:var(--hd);color:#000;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px;position:relative;z-index:5}
header p{margin:0}header .sp{flex:1}
.beta{background:#ffcc00;color:#000;font-size:11px;font-weight:bold;padding:2px 6px;border-radius:4px;margin-left:6px}
.bottone{border:2px solid #000;border-radius:8px;padding:8px 10px;background:#fff;color:#000;cursor:pointer;font-size:14px}
.dropdown{position:relative;display:inline-block}
.dropdown-content{display:none;position:absolute;background:#f1f1f1;min-width:170px;box-shadow:0 8px 16px rgba(0,0,0,.2);z-index:6;border-radius:4px}
.dropdown-content.show{display:block}
.dropdown-content a{color:#000;padding:12px 16px;text-decoration:none;display:block}
.dropdown-content a:hover{background:#ddd}
.banner{background:#ffcc00;color:#000;text-align:center;padding:6px;font-size:13px}
main{min-height:60vh}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 4px 14px rgba(0,0,0,.3)}
h1,h2{margin:.2em 0 .5em}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:bold;cursor:pointer}
.btn:hover{filter:brightness(1.15)}.btn.sec{background:#555}.btn.del{background:var(--ko)}
input,select,textarea{width:100%;padding:10px;margin:5px 0 10px;border-radius:8px;border:1px solid #666;background:#1f1f1f;color:#fff;font-size:15px;font-family:inherit}
input[type=radio]{width:auto;margin:0 8px 0 0}
.opt{display:block;width:100%;text-align:left;background:#1f1f1f;color:#fff;border:2px solid #555;border-radius:10px;padding:12px;margin:8px 0;font-size:15px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:#1d3a2a}.opt.ko{border-color:var(--ko);background:#4a2323}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:13px}
.msg{padding:8px 12px;border-radius:8px;margin:8px 0}.msg.e{background:#4a2323}.msg.s{background:#1d3a2a}
.bar{height:8px;background:#555;border-radius:4px;overflow:hidden}.bar>div{height:100%;background:var(--acc2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
footer{text-align:center;padding:24px;color:var(--mut);font-size:13px}
/* ===== DESIGN “STICKER”: tasti, carte, schermate ===== */
body{font-family:"Space Grotesk",Arial,sans-serif}
.wrap{max-width:900px}
h1{font-size:34px;letter-spacing:-.5px}
header{border-bottom:3px solid #000}
.bottone{border:3px solid #000;border-radius:999px;padding:7px 16px;font-weight:700;font-family:inherit;box-shadow:3px 3px 0 #000;transition:transform .08s,box-shadow .08s}
.bottone:active{transform:translate(3px,3px);box-shadow:none}
.dropdown-content{border:3px solid #000;border-radius:14px;box-shadow:4px 4px 0 #000;overflow:hidden;background:#fff;margin-top:6px}
.beta{border:2px solid #000}
.card{border:2px solid var(--acc2);border-radius:18px;box-shadow:6px 6px 0 rgba(94,234,212,.3)}
.btn{border:3px solid #000;border-radius:999px;padding:11px 22px;background:var(--acc2);color:#04201c;box-shadow:4px 4px 0 #000;font-weight:800;font-family:inherit;transition:transform .08s,box-shadow .08s}
.btn:hover{filter:none;transform:translate(-1px,-1px);box-shadow:5px 5px 0 #000}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn.sec{background:#fbbf24;color:#000}.btn.del{background:#fb7185;color:#000}.btn.vio{background:#a78bfa;color:#000}.btn.gry{background:#374151;color:#fff}
.patente-categorie .cta-test{border:3px solid #000;border-radius:999px;box-shadow:4px 4px 0 #000;background:var(--acc2);color:#04201c;font-family:inherit}
.opts{margin-top:8px}
.opt{display:flex;align-items:center;gap:12px;border:3px solid #000;border-radius:16px;background:#fff;color:#0f1f1c;font-weight:700;font-family:inherit;padding:14px;box-shadow:4px 4px 0 #000;transition:transform .08s,box-shadow .08s}
.opt:disabled{color:#0f1f1c;cursor:default}
.opt:hover:not(:disabled){transform:translate(-1px,-1px)}
.opt:active:not(:disabled){transform:translate(4px,4px);box-shadow:none}
.opt .lt{font-style:normal;background:var(--acc);color:#fff;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.opt.sel{background:var(--acc2)}.opt.ok{background:#86efac;border-color:#000}.opt.ko{background:#fda4af;border-color:#000}
.opts.vf{display:grid;grid-template-columns:1fr 1fr;gap:14px}.opts.vf .opt{justify-content:center;margin:8px 0}
.bar{height:16px;border:3px solid #000;border-radius:999px;background:#fff}.bar>div{background:var(--acc)}
input,select,textarea{border:3px solid #000;border-radius:12px;background:#fff;color:#0f1f1c;font-weight:600}
input[type=radio]{accent-color:var(--acc)}
input:focus,select:focus,textarea:focus{outline:3px solid var(--acc2)}
.msg{border:2px solid #000;color:#000}.msg.e{background:#fda4af}.msg.s{background:#86efac}
/* HERO */
.scroll-stage{height:400vh;position:relative}
.hero-patente{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:40px 40px}
.logo-intro{position:absolute;font-size:48px;font-weight:bold;letter-spacing:1px;z-index:1;opacity:var(--logo-opacity,1);transform:scale(var(--logo-scale,1))}
.patente-3d-wrapper{position:relative;width:600px;max-width:92vw;height:380px;opacity:var(--patente-opacity,0);transform:scale(var(--patente-scale,.3))}
.faccia{width:100%;height:100%;border-radius:20px;background:linear-gradient(135deg,#e8e8e8,#c9d6e3 50%,#b8c9dc);box-shadow:0 20px 60px rgba(0,0,0,.5);border:2px solid #9aa8b8;padding:25px 30px;color:#1a1a2e}
.patente-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1a1a2e;padding-bottom:8px;margin-bottom:15px}
.titolo{font-size:18px;font-weight:bold}
.paese{background:#003399;color:#ffcc00;font-size:11px;font-weight:bold;padding:4px 8px;border-radius:4px}
.patente-corpo{display:flex;gap:20px}
.patente-foto{width:110px;height:140px;background:repeating-linear-gradient(45deg,#ccc,#ccc 10px,#ddd 10px,#ddd 20px);border:2px solid #1a1a2e;border-radius:6px;flex-shrink:0}
.patente-dati{display:flex;flex-direction:column;gap:6px;font-size:14px}
.riga{display:flex;gap:8px}.numero{font-weight:bold;width:22px;opacity:.6}.valore{font-weight:bold}
.patente-categorie{position:relative;display:flex;gap:10px;margin-top:18px;padding-top:12px;border-top:1px solid #9aa8b8}
.cat{width:42px;height:42px;border:2px solid #1a1a2e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;background:rgba(255,255,255,.5)}
.cta-test{position:absolute;left:50%;bottom:4px;transform:translate(-50%,0);width:calc(100% + 20px);max-width:320px;padding:14px 18px;font-size:15px;font-weight:bold;color:#fff;background:var(--acc);border:0;border-radius:10px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.4);opacity:var(--bottone-opacity,0);pointer-events:var(--bottone-pe,none)}
.cta-test:hover{filter:brightness(1.15)}
.scroll-hint{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);font-size:13px;opacity:var(--hint-opacity,.8);animation:rimbalza 1.5s ease-in-out infinite;pointer-events:none}
@keyframes rimbalza{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
@media(max-width:520px){.patente-foto{width:80px;height:100px}.patente-dati{font-size:12px}.faccia{padding:16px}.logo-intro{font-size:34px}}
</style>
</head>

async function hash(t) {
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join(""); }
  catch (e) { return btoa(t); }
}

const conv = x => ({ d: x[1], o: ["Vero", "Falso"], r: x[2] ? 0 : 1, a: x[0] });
const nSim = () => Math.min(CONFIG.simDomande, CONFIG.bancaVF.length);
const argomenti = () => [...new Set(CONFIG.bancaVF.map(x => x[0]))];
const mmss = () => { const s = Math.max(0, Math.round((run.fin - Date.now()) / 1000)); return "⏱ " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function avvia(q) {
  clearInterval(window._t);
  run = { q, i: 0, pt: 0, sel: null, fine: false, err: [], log: [], fin: Date.now() + CONFIG.simMinuti * 60000, t0: Date.now() };
  if (q.sim) window._t = setInterval(tick, 1000);
  location.hash = "quiz"; draw();
}
function tick() {
  if (!run || run.fine) { clearInterval(window._t); return; }
  if (run.fin - Date.now() <= 0) {
    const n = run.q.domande.length; for (let j = run.i + (run.sel === null ? 0 : 1); j < n; j++) run.err.push(run.q.domande[j]);
    run.timeout = true; run.i = n - 1; run.sel = -1; avanti(); return;
  }
  const t = $("#tm"); if (t) t.textContent = mmss();
}
function avviaSim(cat) {
  const d = CONFIG.bancaVF.slice().sort(() => Math.random() - .5).slice(0, nSim()).map(conv);
  avvia({ id: "sim", titolo: "Simulazione esame – Patente " + cat, categoria: cat, autore: "Promosso", sim: true, erroriMax: CONFIG.erroriMax, domande: d });
}
function avviaArg(i) {
  const a = argomenti()[i];
  avvia({ id: "arg" + i, titolo: "Argomento: " + a, categoria: catCorrente, autore: "Promosso", domande: CONFIG.bancaVF.filter(x => x[0] === a).map(conv) });
}
function startErrori() {
  const u = utente(), d = CONFIG.bancaVF.map(conv).filter(x => (u.err || []).includes(x.d)); if (!d.length) return;
  avvia({ id: "err", titolo: "Ripasso dei miei errori", categoria: catCorrente, autore: "Tu", domande: d });
}
function riprova() {
  const q = run.q; if (q.sim) return avviaSim(q.categoria);
  if (q.id === "err") return startErrori();
  if (q.id.startsWith("arg")) return avviaArg(+q.id.slice(3));
  startQuiz(q.id);
}
function promosso() {
  const n = run.q.domande.length, e = n - run.pt;

  $("#bn").style.display = CONFIG.beta ? "block" : "none"; $("#bn").textContent = CONFIG.bannerBeta;
  $("#ft").textContent = `© ${new Date().getFullYear()} ${CONFIG.dominio} · versione beta`;
}
document.addEventListener("click", () => document.querySelectorAll(".dropdown-content.show").forEach(c => c.classList.remove("show")));
function draw() { const h = location.hash.slice(1) || "home"; const k = rotte[h] || "home"; shell(); $("#app").innerHTML = pagine[k](); if (k === "home") anim(); }
window.addEventListener("hashchange", () => { if (location.hash.slice(1) !== "quiz") run = null; draw(); window.scrollTo(0, 0); });

/* ===== animazione hero guidata dallo scroll ===== */
function anim() {
  const st = $("#scrollStage"), hero = $("#heroPatente"); if (!st) return;
  const tot = st.offsetHeight - window.innerHeight; let p = Math.min(Math.max(-st.getBoundingClientRect().top / tot, 0), 1);
  const f1 = Math.min(p / .35, 1), f2 = Math.min(Math.max((p - .25) / .35, 0), 1), f3 = Math.min(Math.max((p - .6) / .2, 0), 1);
  const set = (k, v) => hero.style.setProperty(k, v);
  set("--logo-scale", 1 + f1 * 5); set("--logo-opacity", 1 - f1); set("--patente-opacity", f2); set("--patente-scale", .3 + f2 * .7);
  set("--bottone-opacity", f3); set("--bottone-pe", f3 > .5 ? "auto" : "none"); set("--hint-opacity", p < .05 ? .8 : 0);
}
window.addEventListener("scroll", anim); window.addEventListener("resize", anim);
draw();
</script>
